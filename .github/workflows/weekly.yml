name: Weekly Tropical Report

on:
  schedule:
    - cron: "0 12 * * 0"   # Domingo 12:00 UTC (~09:00 BRT). Ajuste se quiser.
  workflow_dispatch: {}      # botão "Run workflow" manual

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install requests python-dotenv

      - name: Generate weekly payload and report locally
        run: |
          python -m src.cli fetch
          python -m src.cli prepare
          python -m src.cli report

      - name: Generate figures (choropleth)
        run: |
          python -m src.cli visuals

      - name: Fetch MG Bulletin (SES-MG)
        run: |
          python -m src.cli fetch-mg

      - name: Prepare weekly
        run: |
          python -m src.cli fetch
          python -m src.cli prepare
          python -m src.cli visuals
          python -m src.cli report

      - name: Call Dify (PDF text)
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: |
          python -m src.report.call_dify

      - name: Commit weekly artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/weekly/*.md reports/weekly/response.json data/processed/* || true
          git commit -m "chore(report): weekly bulletin" || echo "Nothing to commit"
          git push
