name: Weekly Tropical Report

on:
  schedule:
    - cron: "0 12 * * 0"   # Domingo 12:00 UTC (~09:00 BRT)
  workflow_dispatch: {}

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          # Garantias para o script que extrai texto e chama a API
          pip install pdfplumber requests python-dotenv

      # >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
      # PDFs LOCAIS — GARANTA QUE ESTES ARQUIVOS ESTEJAM VERSIONADOS NO REPO:
      # inputs/mg/current.pdf (obrigatório)
      # inputs/mg/previous.pdf (opcional)
      # >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
      - name: Ensure local PDFs
        run: |
          ls -lah inputs/mg || true
          test -f inputs/mg/current.pdf || (echo "ERRO: inputs/mg/current.pdf não encontrado." && exit 1)
          python - << 'PY'
          from pathlib import Path
          import pdfplumber
          p = Path("inputs/mg/current.pdf")
          with pdfplumber.open(p) as pdf:
              txt = (pdf.pages[0].extract_text() or "")[:500]
          print("OK: current.pdf aberto. Primeiros caracteres:\n", txt)
          PY

      # Gera série/figuras/payload locais (usado para 'kpis' e 'figures' do Start)
      - name: Generate weekly payload and figures
        run: |
          python -m src.cli fetch
          python -m src.cli prepare
          python -m src.cli visuals
          python -m src.cli report

      # Chama o Dify enviando o TEXTO extraído dos PDFs locais
      - name: Call Dify (PDF text)
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: |
          python -m src.report.call_dify

      - name: Commit weekly artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/weekly/*.md reports/weekly/response.json reports/figures/* data/processed/* || true
          git commit -m "chore(report): weekly bulletin" || echo "Nothing to commit"
          git push
